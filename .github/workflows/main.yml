name: Build Billford

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Billford
        run: mvn --batch-mode clean package

      - name: Upload Billford JAR
        uses: actions/upload-artifact@v4
        with:
          name: Billford
          path: target/Billford.jar
          if-no-files-found: error
